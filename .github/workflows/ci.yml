name: CI

on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-dbt:
    name: Unit Tests and dbt Parse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run existing offline unit tests
        run: python -m pytest tests/ -q
      - name: Parse all dbt layers without a warehouse connection
        run: >-
          dbt parse --project-dir leagues_data_dbt --profiles-dir .github/dbt
          --no-partial-parse
          --vars '{"enable_gold_layer": true, "enable_platinum_layer": true}'
