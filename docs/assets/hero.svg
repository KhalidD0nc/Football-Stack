xt><g fill="none" stroke="#bcf38c" stroke-opacity=".5" stroke-width="1.5"><path d="M785 144H1092M785 220H1092M785 296H1092" stroke-dasharray="4 7"/><rect x="771" y="91" width="344" height="224" rx="13"/><path d="M771 166H1115M771 241H1115"/></g>
