version: 2

models:
  - name: stg_teams
    config:
      materialized: table
    description: "Staging teams model from raw /teams payloads."
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(team_id as varchar), '|', cast(league_id as varchar), '|', cast(season as varchar))"

  - name: stg_player_leaderboards
    config:
      materialized: table
    description: "Consolidated top scorers/assists/cards leaderboards."
    columns:
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: ranking_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["top_scorers", "top_assists", "top_yellow_cards", "top_red_cards"]
      - name: player_id
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(league_id as varchar), '|', cast(season as varchar), '|', ranking_type, '|', cast(player_id as varchar))"

  - name: stg_match_team_stats
    config:
      materialized: table
    description: "Team-level per-fixture statistics pivoted from long stat rows."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(fixture_id as varchar), '|', cast(team_id as varchar))"

  - name: stg_lineup_players
    config:
      materialized: table
    description: "Flattened lineup players across start_xi and substitutes."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null
      - name: lineup_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["start_xi", "substitutes"]
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(fixture_id as varchar), '|', cast(team_id as varchar), '|', cast(player_id as varchar), '|', lineup_bucket)"

  - name: stg_fixtures
    config:
      materialized: table
    description: "Fixture backbone model with teams, score, and status context."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "cast(fixture_id as varchar)"

  - name: stg_rounds
    config:
      materialized: table
    description: "League rounds extracted from /fixtures/rounds."
    columns:
      - name: round_name
        data_tests:
          - not_null
      - name: round_number
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(league_id as varchar), '|', cast(season as varchar), '|', round_name)"

  - name: stg_match_events
    config:
      materialized: table
    description: "Match event timeline rows from /fixtures/events."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
      - name: event_sequence
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: event_type
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(fixture_id as varchar), '|', cast(event_sequence as varchar))"

  - name: stg_match_player_stats
    config:
      materialized: table
    description: "Per-player per-match performance from /fixtures/players."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(fixture_id as varchar), '|', cast(team_id as varchar), '|', cast(player_id as varchar))"

  - name: stg_predictions
    config:
      materialized: table
    description: "Pre-match predictions for each fixture."
    columns:
      - name: fixture_id
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "cast(fixture_id as varchar)"

  - name: stg_team_standings
    config:
      materialized: table
    description: "League standings rows per team."
    columns:
      - name: standing_rank
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(team_id as varchar), '|', cast(league_id as varchar), '|', cast(season as varchar))"

  - name: stg_team_statistics
    config:
      materialized: table
    description: "Team aggregate statistics for the season."
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(team_id as varchar), '|', cast(league_id as varchar), '|', cast(season as varchar))"

  - name: stg_player_season_stats
    config:
      materialized: table
    description: "Player season-level statistics from paginated /players data."
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: stats_season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(player_id as varchar), '|', cast(team_id as varchar), '|', cast(stats_season as varchar))"

  - name: stg_squad_players
    config:
      materialized: table
    description: "Current squad list by team from /players/squads."
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(team_id as varchar), '|', cast(player_id as varchar), '|', cast(league_id as varchar), '|', cast(season as varchar))"

  - name: stg_transfers
    config:
      materialized: table
    description: "Transfer history rows extracted from /transfers."
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: transfer_date
        data_tests:
          - not_null
      - name: league_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(league_id as varchar), '|', cast(season as varchar), '|', cast(player_id as varchar), '|', cast(transfer_date as varchar), '|', coalesce(cast(from_team_id as varchar), 'na'), '|', coalesce(cast(to_team_id as varchar), 'na'), '|', coalesce(transfer_type, 'na'))"

  - name: stg_injuries
    config:
      materialized: table
    description: "Injury records from /injuries endpoint."
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(player_id as varchar), '|', coalesce(cast(fixture_id as varchar), 'na'), '|', cast(league_id as varchar), '|', cast(season as varchar), '|', coalesce(injury_type, coalesce(injury_reason, 'na')))"
